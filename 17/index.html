<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Picture Distortion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
                "Courier New", monospace;
            background: radial-gradient(1100px 820px at 18% 18%, rgba(255, 255, 255, 0.07), transparent 58%),
                radial-gradient(900px 820px at 88% 16%, rgba(255, 255, 255, 0.04), transparent 60%),
                radial-gradient(900px 900px at 50% 120%, rgba(255, 255, 255, 0.03), transparent 62%),
                var(--bg);
            color: #ffffff;
            overflow: hidden;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        .controls-scrollbar::-webkit-scrollbar {
            width: 10px;
        }

        .controls-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.25);
        }

        .controls-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.22);
        }

        .safe-area-inset-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
